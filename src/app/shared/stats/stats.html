<div class="stats-row">
  <div class="stat-card">
    <div class="label">Produkte gjithsej</div>
    <div class="value">
      {{ stats?.total_products || 0 }}
    </div>
    <div class="change positive">Produkte ne sistem</div>
  </div>

  <div class="stat-card">
    <div class="label">Kategori gjithsej</div>
    <div class="value">
      {{ stats?.total_categories || 0 }}
    </div>
    <div class="change">Kategori aktive</div>
  </div>

  <div class="stat-card">
    <div class="label">Perdorues</div>
    <div class="value">
      {{ stats?.total_users || 0 }}
    </div>
    <div class="change positive">Perdorues te regjistruar</div>
  </div>

  <div class="stat-card">
    <div class="label">Status sistemi</div>
    <div class="value">Online</div>
    <div class="change positive">API funksionale</div>
  </div>
</div>
